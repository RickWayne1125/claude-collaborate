name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12', '3.13']
        # Python 3.9 has no setup-python build for Ubuntu 26.04.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Repository tests (no Claude or network calls)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Skill tests with fake Claude only
        run: python -m unittest discover -s skills/claude-collaborate/scripts -p "test_*.py" -v
      - name: Build local source ZIP
        run: python scripts/build_release.py
